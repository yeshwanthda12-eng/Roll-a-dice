
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dice Roller</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url("https://c8.alamy.com/comp/3BH9CBY/closeup-of-collection-of-many-different-styles-of-dice-3BH9CBY.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin-bottom: 25px;
      color: #333;
    }

    .dice {
      width: 120px;
      height: 120px;
      margin: 0 auto 25px;
      background: #ff4757;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 70px;
      color: white;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }

    button {
      border: none;
      padding: 14px 30px;
      border-radius: 10px;
      background: #667eea;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #5568d9;
      transform: translateY(-2px);
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #444;
    }

    .rolling {
      animation: roll 0.5s ease;
    }

    @keyframes roll {
      0% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(180deg) scale(1.1);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🎲 Dice Roller</h1>

    <div id="dice" class="dice">⚀</div>

    <button onclick="rollDice()">Roll Dice</button>

    <p id="result">Click the button to roll!</p>
  </div>

  <script>
    const dice = document.getElementById("dice");
    const result = document.getElementById("result");

    const diceFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    function rollDice() {
      dice.classList.remove("rolling");

      // Restart animation
      void dice.offsetWidth;
      dice.classList.add("rolling");

      const randomNumber = Math.floor(Math.random() * 6);

      dice.textContent = diceFaces[randomNumber];
      result.textContent = `You rolled ${randomNumber + 1}`;
    }
  </script>

</body>
</html>
